<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentry Clone - Test Simulator</title>

    <!-- Load rrweb for session replay -->
    <script src="https://cdn.jsdelivr.net/npm/rrweb@latest/dist/rrweb.min.js"></script>

    <!-- Load our Client SDK -->
    <script src="http://127.0.0.1:3535/api/client_sdk.js?v=4"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            background: #f0f2f5;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
            color: white;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-error {
            background: #ef4444;
        }

        .btn-async {
            background: #f59e0b;
        }

        .btn-range {
            background: #8b5cf6;
        }

        .status {
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>محاكي الأخطاء (Test Simulator)</h1>
        <p>استخدم هذه الأزرار لإرسال أخطاء تجريبية إلى النظام.</p>

        <div style="margin: 30px 0;">
            <button onclick="triggerReferenceError()" class="btn-error">خطأ مرجع (ReferenceError)</button>
            <br>
            <button onclick="triggerAsyncError()" class="btn-async">خطأ غير متزامن (Async Error)</button>
            <br>
            <br>
            <button onclick="triggerRangeError()" class="btn-range">خطأ في النطاق (RangeError)</button>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <div style="text-align: center;">
                <h3>Network Tests</h3>
                <button onclick="testFetchSuccess()" style="background: #10b981;">Fetch Success (200)</button>
                <button onclick="testFetchError()" style="background: #ef4444;">Fetch Error (404)</button>
                <button onclick="testXHR()" style="background: #3b82f6;">XHR Request</button>
            </div>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <div style="text-align: center;">
                <h3>Console Tests</h3>
                <button onclick="console.log('Test Log Message')" style="background: #64748b;">Log</button>
                <button onclick="console.info('Test Info Message')" style="background: #0ea5e9;">Info</button>
                <button onclick="console.warn('Test Warning Message')" style="background: #eab308;">Warn</button>
            </div>

            <div class="status" id="status">جاهز للاختبار...</div>
        </div>

        <script>
            // Initialize the Tracker
            Tracker.init({
                trackerUrl: 'http://127.0.0.1:3535',
                project: 'Test Simulator',
                userId: 'Tester-' + Math.floor(Math.random() * 1000)
            });

            function showStatus(msg) {
                const el = document.getElementById('status');
                el.innerHTML = msg;
                el.style.color = 'green';
                setTimeout(() => {
                    el.innerHTML = "جاهز للاختبار...";
                    el.style.color = '#666';
                }, 3000);
            }

            function triggerReferenceError() {
                try {
                    // This variable doesn't exist
                    console.log(nonExistentVariable);
                } catch (e) {
                    // While the tracker catches global errors, we can also manually capture
                    Tracker.captureException(e);
                    showStatus("تم إرسال ReferenceError!");
                    throw e; // Re-throw to ensure it hits console
                }
            }

            async function triggerAsyncError() {
                setTimeout(() => {
                    const err = new Error("فشل في تحميل البيانات (Async)");
                    Tracker.captureException(err);
                    showStatus("تم إرسال Async Error!");
                    console.error(err);
                }, 500);
            }

            function triggerRangeError() {
                try {
                    const arr = new Array(-1);
                } catch (e) {
                    Tracker.captureException(e);
                    showStatus("تم إرسال RangeError!");
                    console.error(e);
                }
            }

            async function testFetchSuccess() {
                showStatus("جاري ارسال Fetch...");
                try {
                    await fetch('https://jsonplaceholder.typicode.com/todos/1');
                    console.log("Fetch Success");
                    showStatus("تم ارسال Fetch بنجاح!");
                } catch (e) {
                    console.error(e);
                }
            }

            async function testFetchError() {
                showStatus("جاري ارسال Fetch (404)...");
                try {
                    await fetch('https://jsonplaceholder.typicode.com/invalid-url-for-test');
                } catch (e) {
                    console.error("Fetch Error caught", e);
                }
                setTimeout(() => showStatus("تم اختبار Fetch 404"), 1000);
            }

            function testXHR() {
                showStatus("جاري ارسال XHR...");
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'https://jsonplaceholder.typicode.com/users/1');
                xhr.onload = () => showStatus("تم ارسال XHR بنجاح!");
                xhr.send();
            }
        </script>
</body>

</html>
